[package]
name = "afterterm"
default-run = "afterterm"
version = "0.1.0"
description = "AfterTerm — a native multi-session terminal"
authors = ["Ryan <straticus1@gmail.com>"]
edition = "2021"

[lib]
name = "afterterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
afterterm-pty = { path = "../crates/afterterm-pty" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
serialport = { version = "4.9", default-features = false }
url = "2"
zeroize = "1"
ureq = "2.12"
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "1.2.4", features = ["hardcoded-credentials"] }
aws-smithy-runtime-api = { version = "1.9.0", features = ["client"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
