[package]
name = "afterterm"
default-run = "afterterm"
version = "0.1.0"
description = "AfterTerm — a native multi-session terminal"
authors = ["Ryan <straticus1@gmail.com>"]
edition = "2021"

[lib]
name = "afterterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
afterterm-pty = { path = "../crates/afterterm-pty" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
serialport = { version = "4.9", default-features = false }
